name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  ci:
    uses: Quantova/Quantova-Ci/.github/workflows/rust-ci.yml@d945b9ed017de20a327f6103579dc1a416f46f70
    with:
      deny-unsafe-code: true
      deny-float-arithmetic: true
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.98.0"
      - run: cargo test --locked --release --manifest-path fuzz/Cargo.toml
      - run: cargo build --locked --release --manifest-path fuzz/Cargo.toml --bins
