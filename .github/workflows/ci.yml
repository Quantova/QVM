name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  ci:
    uses: Quantova/Quantova-Ci/.github/workflows/rust-ci.yml@709cc10c8c0407357a0a3fa2a2922312e71df0ea
    with:
      deny-unsafe-code: true
      deny-float-arithmetic: true
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.98.0"
      - run: cargo test --locked --release --manifest-path fuzz/Cargo.toml
      - run: cargo build --locked --release --manifest-path fuzz/Cargo.toml --bins
